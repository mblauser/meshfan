[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meshfan"
version = "0.1.0"
description = "MQTT fan-out relay that signs Ed25519 device JWTs for MeshCore MQTT-over-WebSocket brokers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "meshfan contributors" }]
keywords = [
    "meshcore",
    "mqtt",
    "websocket",
    "wss",
    "jwt",
    "ed25519",
    "fanout",
    "relay",
    "device-signing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
    "Topic :: System :: Networking",
]
# Only dependencies that are directly beneficial to the goal.
dependencies = [
    "paho-mqtt>=2.1,<3",        # MQTT client (plain TCP + WebSocket transport)
    "websocket-client>=1.8",    # WebSocket transport backend required by paho-mqtt
    "cryptography>=42.0",       # Ed25519 signing (the standard, well-audited library)
    "PyYAML>=6.0",             # human-readable config files
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
meshfan = "meshfan.__main__:main"

[project.urls]
Homepage = "https://github.com/USER/meshfan"
Documentation = "https://github.com/USER/meshfan/blob/main/README.md"
Changelog = "https://github.com/USER/meshfan/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["meshfan*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
