[build-system]
# setuptools >= 77 for the PEP 639 SPDX license expression.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meshfan"
dynamic = ["version"]
description = "MQTT fan-out relay that signs Ed25519 device JWTs for MeshCore MQTT-over-WebSocket brokers"
readme = "README.md"
# ed25519-orlp 0.1.3 does not import on Python 3.9 (its own source uses
# `bytes | None` annotations without `from __future__ import annotations`);
# verified by installing 0.1.3 into a 3.9 venv (TypeError at import) and a
# 3.10 venv (imports fine).
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "meshfan contributors" }]
keywords = [
    "meshcore",
    "mqtt",
    "websocket",
    "wss",
    "jwt",
    "ed25519",
    "fanout",
    "relay",
    "device-signing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications",
    "Topic :: System :: Networking",
]
# Core = the pure signer: only ed25519-orlp. The daemon needs paho-mqtt
# ([daemon]); YAML config parsing needs PyYAML ([config], imported lazily).
dependencies = [
    "ed25519-orlp~=0.1.3",      # Ed25519 signing (the exact reference library; pins 0.1.x)
]

[project.optional-dependencies]
daemon = [
    "paho-mqtt>=2.1,<3",        # MQTT client (plain TCP + its own WebSocket transport)
]
config = [
    "PyYAML>=6.0",              # human-readable config files
]
full = [
    "paho-mqtt>=2.1,<3",
    "PyYAML>=6.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "paho-mqtt>=2.1,<3",
    "PyYAML>=6.0",
]

[project.scripts]
meshfan = "meshfan.cli:main"

[tool.setuptools.dynamic]
version = {attr = "meshfan.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["meshfan*"]

[tool.setuptools.package-data]
meshfan = ["py.typed", "data/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
