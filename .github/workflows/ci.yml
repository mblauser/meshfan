name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 3.9 is deliberately absent: ed25519-orlp 0.1.3 does not import on
    # 3.9 (its own source uses `bytes | None` annotations without
    # `from __future__ import annotations`), so requires-python is >=3.10.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify ed25519-orlp imports and works
        run: |
          python -c "
          from ed25519_orlp import ed25519_sign, ed25519_verify, ed25519_create_keypair
          pub, priv, _seed = ed25519_create_keypair()
          sig = ed25519_sign(b'ci probe', pub, priv)
          assert ed25519_verify(sig, b'ci probe', pub)
          print('ed25519-orlp OK')
          "
      - name: Verify dependency locks install cleanly
        # Version-independent: install the exact locked versions. pip adds any
        # conditional backport deps (e.g. exceptiongroup/tomli on Python < 3.11)
        # as needed, so a single lock is valid across the whole matrix. A lock
        # cannot be "the latest resolution" for every Python version at once
        # (resolution is version-dependent), so this verifies installability
        # rather than freshness; regenerate the lock when a constraint changes.
        run: |
          pip install -r requirements.lock
          pip install -r requirements-dev.lock
      - name: Lint
        run: ruff check meshfan tests
      - name: Test (network-isolated)
        run: pytest -q
